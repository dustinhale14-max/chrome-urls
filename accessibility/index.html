<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome - Organization Not Installed</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --button-bg: #1a73e8;
            --button-text: #ffffff;
            --accent-red: #ea4335;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --text-primary: #e8eaed;
                --text-secondary: #9aa0a6;
                --button-bg: #8ab4f8;
                --button-text: #202124;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 24px;
        }

        .container {
            margin: auto 0;
            max-width: 560px;
            width: 100%;
        }

        .icon-container {
            margin-bottom: 24px;
        }

        .error-icon {
            width: 56px;
            height: 56px;
            fill: var(--accent-red);
        }

        h1 {
            font-size: 22px;
            font-weight: 400;
            line-height: 28px;
            margin-bottom: 16px;
        }

        p {
            font-size: 14px;
            line-height: 20px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .error-code {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-transform: uppercase;
        }

        .btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            display: inline-block;
        }

        .btn:active {
            box-shadow: none;
            opacity: 0.9;
        }

        .details-toggle {
            margin-top: 32px;
            font-size: 14px;
            color: var(--button-bg);
            cursor: pointer;
            display: inline-block;
            user-select: none;
        }

        .details-content {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            font-size: 13px;
            line-height: 18px;
            color: var(--text-secondary);
        }

        @media (prefers-color-scheme: dark) {
            .details-content {
                background-color: rgba(255, 255, 255, 0.05);
            }
        }

        .details-content.show {
            display: block;
        }
    </style>
</head>
<body>

        <h1>Page load failed because the Developer UI module "g" is not instead</h1>
        <p>Try:<br>
            • Reloading the page<br>
            • Checking your Internet connection</p>
        </div>
    </div>

</body>
</html>
